name: Create/Update import branch
description: Creates/Updates an import branch based on new UFO sources

inputs:
  updated-sources:
    description: The path for the updated sources
    required: true
  imported-branch:
    description: The name of the branch that was imported from
    required: true
  git-email:
    description: The email to use for the Git commit
    required: true

runs:
  using: composite
  steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        path: main
    - name: Create/Checkout branch
      shell: bash
      env:
        TARGET_BRANCH: ${{ format('import-{0}', inputs.imported-branch) }}
      run: |
        # Try to fetch branch, if it doesn't exist we'll create it
        if git fetch origin "$TARGET_BRANCH" &>/dev/null ; then
          echo "The target branch '$TARGET_BRANCH' already exists, updating."
          git -C main worktree add --quiet target "$TARGET_BRANCH"
        else
          echo "The target branch '$TARGET_BRANCH' doesn't exist, creating."
          git -C main worktree add --quiet target -b "$TARGET_BRANCH" origin/main
        fi
    - name: Apply changes
      shell: bash
      run: |
        shopt -s dotglob
        echo "::group::Delete existing files"
        find target -mindepth 1 -maxdepth 1 -not -path "target/.git" -exec rm -rfv {} \;
        echo "::endgroup::"
        mv --no-clobber "${{ inputs.updated-sources }}"/* target
    - name: Commit & push changes
      shell: bash
      env:
        TARGET_BRANCH: ${{ format('import-{0}', inputs.imported-branch) }}
      run: |
        cd target
        git config user.name "Import Script"
        git config user.email ${{ inputs.git-email }}
        git add sources
        git commit --quiet -m "Import from ${{ inputs.imported-branch }}
          
        This commit was creating automatically using the GitHub workflow"
        git push -u origin "$TARGET_BRANCH"
