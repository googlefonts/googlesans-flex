name: Convert Glyphs package to UFO
description: Convert Glyphs package to UFO using scripts/glyphs_to_ds.py

inputs:
  git-ref:
    description: The Git reference to convert
    required: true

outputs:
  directory:
    description: Where the repository with the converted sources is
    value: ${{ steps.prepare-import.outputs.target }}

runs:
  using: composite
  steps:
  - name: Set up Python
    uses: actions/setup-python@v4
    with:
      cache: "pip"
  - name: Checkout Octavio's sources
    uses: actions/checkout@v4
    with:
      ref: ${{ inputs.git-ref }}
      path: octavio
  - name: Prepare import
    id: prepare-import
    shell: bash
    run: |
      if [[ ! -d main ]]; then
        echo "main has not been checked out, this should be done before running glyphspackage2ufo"
        exit 1
      fi
      target=$(mktemp --tmpdir=. --directory glyphspackage2ufo)
      ./main/.github/actions/glyphspackage2ufo/copy-exclude main "$target" .git
      echo "Target dir: $target"
      echo "target=$GITHUB_WORKSPACE/$target" >> "$GITHUB_OUTPUT"
      echo "::group::Remove everything except the config.yaml"
      rm -rfv "$GITHUB_WORKSPACE/$target/sources/"*.{ufo,designspace}
      echo "::endgroup::""
  - name: Run import script
    shell: bash
    run: |
      cd target
      echo "::group::Setup venv"
      make venv
      echo "::endgroup::"
      echo "Running glyphs_to_ds.py"
      venv/bin/python scripts/glyphs_to_ds.py \
        "$GITHUB_WORKSPACE/octavio/sources-v2_0/GSF-full.glyphspackage" \
        "${{ steps.prepare-import.outputs.target }}/sources/GoogleSansFlex.designspace"
