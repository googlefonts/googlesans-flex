name: Update from sources

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: The Git reference to import from (branch name or 7 character commit reference)
        required: true
      email:
        description: Your GitHub email address (CLA approved)
        required: true

jobs:
  import-branch:
    runs-on: [linux, googlefonts-64cores-256GB]
    steps:
      - name: "Convert Glyphs package sources to UFO"
        id: glyphspackage2ufo
        uses: ./.github/actions/glyphspackage2ufo
      - name: "Create/Update import branch"
        uses: ./.github/actions/create-import-branch
        with:
          updated-sources: ${{ steps.glyphspackage2ufo.outputs.directory }}
          imported-branch: ${{ github.event.inputs.git-ref }}
          git-email: ${{ github.event.inputs.email }}

