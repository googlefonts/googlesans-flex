name: Update from sources

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The name of the branch to import from"
        required: true

jobs:
  import-branch:
    # If basing against main, assume we're creating a new import branch
    # if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          path: main
      - name: Prepare environment
        env:
          STAGING_BRANCH: ${{ github.event.inputs.branch }}
          IMPORT_BRANCH: ${{ format('import-{0}', github.event.inputs.branch) }}
        run: |
          cd "$GITHUB_WORKSPACE/main"
          git fetch origin "$STAGING_BRANCH"
          git branch "$STAGING_BRANCH" "origin/$STAGING_BRANCH"
          git worktree add --quiet ../staging "$STAGING_BRANCH"
      - name: Run import scripts
        uses: ./main/.github/actions/import
      - name: Commit & push changes
        env:
          STAGING_BRANCH: ${{ github.event.inputs.branch }}
          IMPORT_BRANCH: ${{ format('import-{0}', github.event.inputs.branch) }}
        run: |
          cd "$GITHUB_WORKSPACE/main"
          git checkout -b "$IMPORT_BRANCH"
          git config user.name "Import Script"
          git config user.email "jany.belluz@daltonmaag.com"
          git add sources
          git commit --quiet -m "Import from $STAGING_BRANCH
            
          This commit was creating automatically using the GitHub workflow"
          git push -u origin "$IMPORT_BRANCH"
      - name: Open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMPORT_BRANCH: ${{ format('import-{0}', github.event.inputs.branch) }}
        run: |
          cd "$GITHUB_WORKSPACE/main"
          gh pr create --head "$IMPORT_BRANCH" --fill
