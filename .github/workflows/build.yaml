name: Build from Glyphs

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: The branch to build from
        required: true
  push:
    branches:
    - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
    - main

jobs:
  build:
    runs-on: googlefonts-64cores-256GB
    timeout-minutes: 15
    steps:
    # on: pull_request uses head_ref for branch name, on: push uses ref_name
    - name: Checkout ${{ inputs.git-ref || github.head_ref || github.ref_name }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ inputs.git-ref || github.head_ref || github.ref_name }}
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version-file: ./.github/workflows/python-version.txt
    - name: Build font
      id: build-ufos
      uses: ./.github/actions/build-ufos-py
    outputs:
      artifact-name: ${{ steps.build-ufos.outputs.artifact-name }}
  test:
    needs:
    - build
    runs-on: googlefonts-8cores-32GB
    timeout-minutes: 40
    steps:
    - name: Checkout ${{ inputs.git-ref || github.head_ref || github.ref_name }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ inputs.git-ref || github.head_ref || github.ref_name }}
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version-file: .github/workflows/python-version.txt
    - name: Set up uv and enable caching
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          requirements*.txt
          requirements*.in
    - name: Download built fonts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: ${{ needs.build.outputs.artifact-name }}
        path: fonts/variable
    - name: Avoid re-building fonts
      shell: bash
      run: |
        if [ -d "fonts/variable" ]; then
          # Trick make into not re-building the fonts
          touch build.stamp
        else
          echo "::error title=Built fonts not found::No built fonts in ./fonts/variable"
          exit 1
        fi
    - name: Check with OT Sanitizer
      uses: f-actions/opentype-sanitizer@d5603373a9adccd136dd48b037b9b5178b485bea  # v4.0.0
      with:
        path: fonts/variable/*.ttf
    - name: Analyze TTF file size
      shell: bash
      run: make font-size
    - name: Run shaperglot
      shell: bash
      run: |
        touch build.stamp
        make shaperglot
    - name: Setup Fontspector
      uses: fonttools/setup-fontspector@d53404291dc78a5a41cf76ea48e1d13a731fb812  # main
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Run Fontbakery/Fontspector
      id: fontbakery
      shell: bash
      run: scripts/fontbakery.sh
    - name: Upload Fontbakery/Fontspector reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      # Always upload reports (even during a pipeline fail), so long as Fontbakery completed
      # https://docs.github.com/en/actions/learn-github-actions/expressions#always
      # https://docs.github.com/en/actions/learn-github-actions/contexts#steps-context
      if: ${{ !cancelled() && (steps.fontbakery.conclusion == 'success' || steps.fontbakery.conclusion == 'failure') }}
      with:
        name: Fontbakery & Fontspector reports
        path: |
          out/fontbakery
          out/fontspector
        if-no-files-found: error
