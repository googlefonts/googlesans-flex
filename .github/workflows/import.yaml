name: Update from sources

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: The branch to import from
        required: true
      email:
        description: Your GitHub email address (CLA approved)
        required: true

jobs:
  import-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Explicit permission is required to push the import commit.
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: main
      - name: Log & validate inputs
        run: |
          echo "git-ref: ${INPUT_GIT_REF}"
          echo "git-email: ${INPUT_EMAIL}"
          echo "python-version-file: $(head -n 1 -z ./main/.github/workflows/python-version.txt)"
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error title=Pipeline not run on main::Import workflow should always be run from main"
            exit 1
          fi
        env:
          INPUT_GIT_REF: ${{ github.event.inputs.git-ref }}
          INPUT_EMAIL: ${{ github.event.inputs.email }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Convert Glyphs package sources to UFO
        id: glyphspackage2ufo
        uses: ./main/.github/actions/glyphspackage2ufo
        with:
          git-ref: ${{ github.event.inputs.git-ref }}
      - name: Create/Update import branch
        id: create-update-import
        uses: ./main/.github/actions/create-import-branch
        with:
          updated-sources: ${{ steps.glyphspackage2ufo.outputs.directory }}
          imported-branch: ${{ github.event.inputs.git-ref }}
          git-email: ${{ github.event.inputs.email }}
    outputs:
      import-branch: ${{ steps.create-update-import.outputs.import-branch }}
  build-variable:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: import-branch
    steps:
      - name: Checkout ${{ needs.import-branch.outputs.import-branch }}
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.import-branch.outputs.import-branch }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ./.github/workflows/python-version.txt
      - name: Build fonts
        id: build-ufos
        uses: ./.github/actions/build-ufos-py
    outputs:
      variable-artifact: ${{ steps.build-ufos.outputs.artifact-name }}
  test:
    needs:
    - import-branch
    - build-variable
    uses: daltonmaag/googlesans-flex-playground/.github/workflows/tests.yml@main
    with:
      branch: ${{ needs.import-branch.outputs.import-branch }}
      artifact-name: ${{ needs.build-variable.outputs.variable-artifact }}
