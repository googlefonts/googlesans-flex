name: Build from UFOs

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: The branch to build from
        required: true
  push:
    branches:
      - main
    tags:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    # A release, pre-release, or draft of a release was published
    types: [published]

jobs:
  build:
    runs-on: [linux, googlefonts-64cores-256GB]
    timeout-minutes: 15
    steps:
    # on: pull_request uses head_ref for branch name, on: push uses ref_name
    - name: Checkout ${{ inputs.git-ref || github.head_ref || github.ref_name }}
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.git-ref || github.head_ref || github.ref_name }}
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version-file: ./.github/workflows/python-version.txt
        cache: pip
    - name: Build font
      id: build-ufos
      uses: ./.github/actions/build-ufos-py
    outputs:
      artifact-name: ${{ steps.build-ufos.outputs.artifact-name }}
  test:
    runs-on: [linux, googlefonts-64cores-256GB]
    timeout-minutes: 20
    needs:
    - build
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
    - name: Download built fonts
      uses: actions/download-artifact@v3
      with:
        name: ${{ needs.build.outputs.artifact-name }}
        path: fonts/variable
    - name: Run tests
      uses: ./.github/actions/tests
  release:
    # Only run if the commit is tagged...
    if: github.event_name == 'release'
    # ... and it builds successfully
    needs:
    - build
    - test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Download artifact files
      uses: actions/download-artifact@v3
      with:
        name: ${{ needs.build.outputs.artifact-name }}
        path: ${{ needs.build.outputs.artifact-name }}
    - name: Create release archive
      run: |
        release_zip_name="GoogleSansFlex-${GITHUB_REF#refs/*/}.zip"
        echo "RELEASE_ZIP_NAME=$release_zip_name" >> "$GITHUB_ENV"
        cd "${{ needs.build.outputs.artifact-name }}" && zip "../$release_zip_name" *.ttf
    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ env.RELEASE_ZIP_NAME }}
        asset_name: ${{ env.RELEASE_ZIP_NAME }}
        tag: ${{ github.ref }}
        overwrite: true
        body: "Production ready fonts"
